<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aria2DM Settings</title>
    <style>
        body { background: #121216; color: #9ca3af; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #202026; padding: 25px; border-radius: 12px; border: 1px solid #374151; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #fff; margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; }
        label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; background: #18181c; border: 1px solid #374151; border-radius: 6px; color: white; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #06b6d4; }
        button { width: 100%; padding: 12px; background: #06b6d4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0891b2; }
        #status { padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="t_title">⚙️ Aria2DM Extension</h2>
        <div id="status"></div>
        
        <label id="t_rpc">URL RPC:</label>
        <input type="text" id="rpc_url" placeholder="http://127.0.0.1:6800/jsonrpc">
        
        <label id="t_secret">Token Rahasia:</label>
        <input type="password" id="rpc_secret" placeholder="Secret Token">
        
        <label id="t_lang">Bahasa / Language:</label>
        <select id="lang_select">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
        </select>
        
        <button id="save_btn">Simpan Konfigurasi</button>
    </div>
    <script src="options.js"></script>
</body>
</html>
